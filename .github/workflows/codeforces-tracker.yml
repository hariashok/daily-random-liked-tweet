name: Codeforces Green Tracker

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}

jobs:
  check_submission:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    - name: Run checker
      id: run_script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python check_codeforces_submission.py | tee output.txt
        if grep -q "NOTIFIED" output.txt; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    # Commit state so next runs remember
    - name: Commit state
      if: steps.run_script.outputs.changed == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add state/last_notified.txt
        git commit -m "update last notified"
        git push
