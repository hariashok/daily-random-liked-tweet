name: 17 Second Manifestation Reminder

on:
  schedule:
    # 06:00 IST -> 00:30 UTC
    - cron: "30 0 * * *"

    # 08:40 IST -> 03:10 UTC
    - cron: "10 3 * * *"

    # 11:00 IST -> 05:30 UTC
    - cron: "30 5 * * *"

    # 14:30 IST -> 09:00 UTC
    - cron: "0 9 * * *"

    # 19:00 IST -> 13:30 UTC
    - cron: "30 13 * * *"

    # 21:00 IST -> 15:30 UTC
    - cron: "30 15 * * *"

  workflow_dispatch: {}

jobs:
  send_manifestation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    - name: Send 17 second manifestation
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python send_static_17sec_manifestation.py
